<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory | THE MOMO Café</title>
<link rel="stylesheet" href="admin.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://kit.fontawesome.com/6d2ea823d0.js" crossorigin="anonymous"></script>
</head>
<body>
<div class="dashboard">
<aside class="sidebar">
<h2>🍜 THE MOMO Café</h2>
<ul>
<a href="dashboard.html"><li><i class="fas fa-chart-line"></i> Dashboard</li></a>
<a href="inventory.html"><li class="active"><i class="fas fa-box"></i> Inventory</li></a>
<a href="orders.html"><li><i class="fas fa-utensils"></i> Orders</li></a>
<a href="reports.html"><li><i class="fas fa-chart-bar"></i> Reports</li></a>
<a href="../index.html"><li><i class="fas fa-globe"></i> Website</li></a>
<a href="login.html"><li><i class="fas fa-right-from-bracket"></i> Logout</li></a>
</ul>
</aside>
<main class="content">
<header>
<h1>Inventory Management</h1>
</header>
<section class="table-section">
<h2>Current Stock</h2>
<table>
<thead>
<tr>
    <th>Item</th>
    <th>Category</th>
    <th>Available</th>
    <th>Status</th>
</tr>
</thead>
<tbody id="inventoryTable">
</tbody>
</table>
</section>
<section class="cards">
<div class="card">
<h3>Add New Item</h3>
<button id="addItemBtn">Add Item</button>
</div>
<div class="card">
<h3>Update Stock</h3>
<button id="updateStockBtn">Update</button>
</div>
<div class="card">
<h3>Delete Item</h3>
<button id="deleteItemBtn">Delete</button>
</div>
<div class="card">
<h3>Generate Report</h3>
<button id="exportBtn">Export</button>
</div>
</section>
</main>
</div>
<!-- ADD ITEM MODAL -->
<div id="addModal" class="modal">
<div class="modal-content">
<h2>Add New Item</h2>
<input type="text" id="addItemName" placeholder="Item name">
<input type="text" id="addCategory" placeholder="Category">
<input type="number" id="addQuantity" placeholder="Quantity">
<input type="text" id="addUnit" placeholder="Unit (kg, litre, pieces)">
<input type="number" id="addLowStock" placeholder="Low stock limit">
<input type="number" id="addPrice" placeholder="Price">
<div class="modal-buttons">
<button id="saveItemBtn">Save</button>
<button id="closeAddBtn">Cancel</button>
</div>
</div>
</div>
<!-- UPDATE STOCK MODAL -->
<div id="updateModal" class="modal">
<div class="modal-content">
<h2>Update Stock</h2>
<select id="updateItem"></select>
<input type="number" id="updateQuantity" placeholder="New quantity">
<div class="modal-buttons">
<button id="saveUpdateBtn">Update</button>
<button id="closeUpdateBtn">Cancel</button>
</div>
</div>
</div>
<!-- DELETE ITEM MODAL -->
<div id="deleteModal" class="modal">
<div class="modal-content">
<h2>Delete Item</h2>
<select id="deleteItem"></select>
<div class="modal-buttons">
<button id="confirmDeleteBtn">Delete</button>
<button id="closeDeleteBtn">Cancel</button>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://rwervygorcsmztbwfeqq.supabase.co";
const SUPABASE_KEY = "sb_publishable_cRA3wSzbzBnH6bSOuu1xLw_rr0Bal6h";
const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);
const inventoryTable = document.getElementById("inventoryTable");
let inventoryData = [];
/* =========================
   LOAD INVENTORY
========================= */
async function loadInventory(){
    const { data, error } = await supabaseClient
        .from("inventory")
        .select("*")
        .order("item_name", { ascending: true });
    console.log("INVENTORY DATA:", data);
    console.log("INVENTORY ERROR:", error);
    if(error){
        inventoryTable.innerHTML = `
            <tr>
                <td colspan="4">
                    Error loading inventory: ${error.message}
                </td>
            </tr>
        `;
        return;
    }
    inventoryData = data || [];
    inventoryTable.innerHTML = "";
    if(inventoryData.length === 0){
        inventoryTable.innerHTML = `
            <tr>
                <td colspan="4">
                    No inventory items found.
                </td>
            </tr>
        `;
        return;
    }
    inventoryData.forEach((item) => {
        const status =
            item.quantity <= item.low_stock
                ? "Low Stock"
                : "In Stock";
        inventoryTable.innerHTML += `
            <tr>
                <td>${item.item_name}</td>
                <td>${item.category}</td>
                <td>${item.quantity} ${item.unit || ""}</td>
                <td>${status}</td>
            </tr>
        `;
    });
}
/* =========================
   ADD ITEM
========================= */
const addModal = document.getElementById("addModal");
document.getElementById("addItemBtn").addEventListener("click", () => {
    addModal.style.display = "flex";
});
document.getElementById("closeAddBtn").addEventListener("click", () => {
    addModal.style.display = "none";
});
document.getElementById("saveItemBtn").addEventListener("click", async () => {
    const item_name = document.getElementById("addItemName").value.trim();
    const category = document.getElementById("addCategory").value.trim();
    const quantity = Number(document.getElementById("addQuantity").value);
    const unit = document.getElementById("addUnit").value.trim();
    const low_stock = Number(document.getElementById("addLowStock").value);
    const price = Number(document.getElementById("addPrice").value);
    if(!item_name || !category || !unit){
        alert("Please fill in all required fields.");
        return;
    }
    const { error } = await supabaseClient
        .from("inventory")
        .insert([
            {
                item_name,
                category,
                quantity,
                unit,
                low_stock,
                price
            }
        ]);
    if(error){
        alert("Error adding item: " + error.message);
        console.error(error);
        return;
    }
    alert("Item added successfully!");
    addModal.style.display = "none";
    document.getElementById("addItemName").value = "";
    document.getElementById("addCategory").value = "";
    document.getElementById("addQuantity").value = "";
    document.getElementById("addUnit").value = "";
    document.getElementById("addLowStock").value = "";
    document.getElementById("addPrice").value = "";
    loadInventory();
});
/* =========================
   UPDATE STOCK
========================= */
const updateModal = document.getElementById("updateModal");
const updateItem = document.getElementById("updateItem");
document.getElementById("updateStockBtn").addEventListener("click", () => {
    updateItem.innerHTML = "";
    inventoryData.forEach((item) => {
        updateItem.innerHTML += `
            <option value="${item.id}">
                ${item.item_name} — ${item.quantity} ${item.unit || ""}
            </option>
        `;
    });
    if(inventoryData.length === 0){
        alert("No inventory items available.");
        return;
    }
    updateModal.style.display = "flex";
});
document.getElementById("closeUpdateBtn").addEventListener("click", () => {
    updateModal.style.display = "none";
});
document.getElementById("saveUpdateBtn").addEventListener("click", async () => {
    const id = updateItem.value;
    const quantity = Number(
        document.getElementById("updateQuantity").value
    );
    if(document.getElementById("updateQuantity").value === ""){
        alert("Please enter a quantity.");
        return;
    }
    const { error } = await supabaseClient
        .from("inventory")
        .update({
            quantity: quantity,
            updated_at: new Date().toISOString()
        })
        .eq("id", id);
    if(error){
        alert("Error updating stock: " + error.message);
        console.error(error);
        return;
    }
    alert("Stock updated successfully!");
    updateModal.style.display = "none";
    document.getElementById("updateQuantity").value = "";
    loadInventory();
});
/* =========================
   DELETE ITEM
========================= */
const deleteModal = document.getElementById("deleteModal");
const deleteItem = document.getElementById("deleteItem");
document.getElementById("deleteItemBtn").addEventListener("click", () => {
    deleteItem.innerHTML = "";
    inventoryData.forEach((item) => {
        deleteItem.innerHTML += `
            <option value="${item.id}">
                ${item.item_name}
            </option>
        `;
    });
    if(inventoryData.length === 0){
        alert("No inventory items available.");
        return;
    }
    deleteModal.style.display = "flex";
});
document.getElementById("closeDeleteBtn").addEventListener("click", () => {
    deleteModal.style.display = "none";
});
document.getElementById("confirmDeleteBtn").addEventListener("click", async () => {
    const id = deleteItem.value;
    const confirmed = confirm(
        "Are you sure you want to delete this item?"
    );
    if(!confirmed){
        return;
    }
    const { error } = await supabaseClient
        .from("inventory")
        .delete()
        .eq("id", id);
    if(error){
        alert("Error deleting item: " + error.message);
        console.error(error);
        return;
    }
    alert("Item deleted successfully!");
    deleteModal.style.display = "none";
    loadInventory();
});
/* =========================
   EXPORT CSV
========================= */
document.getElementById("exportBtn").addEventListener("click", () => {
    if(inventoryData.length === 0){
        alert("There is no inventory data to export.");
        return;
    }
    let csv = "Item,Category,Quantity,Unit,Low Stock,Price\n";
    inventoryData.forEach((item) => {
        csv += `"${item.item_name}","${item.category}",${item.quantity},"${item.unit}",${item.low_stock},${item.price}\n`;
    });
    const blob = new Blob(
        [csv],
        { type: "text/csv;charset=utf-8;" }
    );
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "momo-cafe-inventory.csv";
    link.click();
    URL.revokeObjectURL(url);
});
/* =========================
   INITIAL LOAD
========================= */
loadInventory();
/* =========================
   REALTIME
========================= */
const inventoryChannel = supabaseClient
    .channel("inventory-realtime")
    .on(
        "postgres_changes",
        {
            event: "*",
            schema: "public",
            table: "inventory"
        },
        (payload) => {
            console.log("INVENTORY UPDATE:", payload);
            loadInventory();
        }
    )
    .subscribe((status) => {
        console.log("Inventory realtime:", status);
    });
</script>
<style>
/* Simple modal styling */
.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    justify-content: center;
    align-items: center;
    z-index: 1000;
}
.modal-content {
    background: white;
    padding: 30px;
    border-radius: 12px;
    width: 90%;
    max-width: 400px;
}
.modal-content h2 {
    margin-bottom: 20px;
}
.modal-content input,
.modal-content select {
    width: 100%;
    padding: 10px;
    margin-bottom: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-family: Poppins, sans-serif;
}
.modal-buttons {
    display: flex;
    gap: 10px;
}
.modal-buttons button {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}
</style>
</body>
</html>
