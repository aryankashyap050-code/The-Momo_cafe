<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =====================================
   SUPABASE CONNECTION
===================================== */


const SUPABASE_URL =
"https://rwervygorcsmztbwfeqq.supabase.co";


const SUPABASE_KEY =
"sb_publishable_cRA3wSzbzBnH6bSOuu1xLw_rr0Bal6h";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);



/* =====================================
   ELEMENTS
===================================== */


const revenueElement =
document.getElementById("revenue");


const totalOrdersElement =
document.getElementById("totalOrders");


const pendingOrdersElement =
document.getElementById("pendingOrders");


const customersElement =
document.getElementById("customers");


const recentOrdersElement =
document.getElementById("recentOrders");


const lowStockElement =
document.getElementById("lowStockTable");



/* =====================================
   CONVERT ITEMS INTO READABLE TEXT
===================================== */


function getItemText(items) {

    if (!items) {
        return "Order";
    }


    /* If Items is stored as JSON text */

    if (typeof items === "string") {

        try {

            items = JSON.parse(items);

        }

        catch (error) {

            return items;

        }

    }


    /* If Items is an array */

    if (Array.isArray(items)) {

        return items.map(item => {

            /* Example:
               ["Veg Momos", "Chicken Momos"]
            */

            if (typeof item === "string") {

                return item;

            }


            /* Example:
               { name: "Veg Momos", quantity: 2 }
            */

            if (typeof item === "object" && item !== null) {

                const name =
                    item.name ||
                    item.item_name ||
                    item.item ||
                    item.title ||
                    item.product_name;


                const quantity =
                    item.quantity ||
                    item.qty;


                if (name && quantity) {

                    return `${name} x${quantity}`;

                }


                if (name) {

                    return name;

                }


                /* If object has one key,
                   for example:
                   { "Veg Momos": 2 }
                */

                const keys =
                    Object.keys(item);

                if (keys.length === 1) {

                    const key =
                        keys[0];

                    return `${key} x${item[key]}`;

                }


                return "Item";

            }


            return String(item);

        }).join(", ");

    }


    /* If Items is a single object */

    if (
        typeof items === "object" &&
        items !== null
    ) {

        const name =
            items.name ||
            items.item_name ||
            items.item ||
            items.title ||
            items.product_name;


        const quantity =
            items.quantity ||
            items.qty;


        if (name && quantity) {

            return `${name} x${quantity}`;

        }


        if (name) {

            return name;

        }


        /* Example:
           { "Chicken Momos": 2 }
        */

        const keys =
            Object.keys(items);


        if (keys.length === 1) {

            const key =
                keys[0];

            return `${key} x${items[key]}`;

        }


        /* Last fallback */

        return Object.entries(items)
            .map(([key, value]) =>
                `${key}: ${value}`
            )
            .join(", ");

    }


    return String(items);

}



/* =====================================
   LOAD ORDERS
===================================== */


async function loadOrders() {


    const { data, error } =

        await supabaseClient

        .from("Orders")

        .select("*")

        .order("created_at", {
            ascending: false
        });



    console.log(
        "DASHBOARD ORDERS:",
        data
    );


    console.log(
        "ORDERS ERROR:",
        error
    );



    if (error) {

        console.error(
            "Error loading orders:",
            error
        );

        return;

    }



    const orders =
        data || [];



    /* =================================
       TOTAL REVENUE
    ================================= */


    let revenue = 0;


    orders.forEach(order => {

        revenue +=
            Number(order.total_amount) || 0;

    });


    revenueElement.innerHTML =
        "₹" + revenue.toFixed(2);



    /* =================================
       TOTAL ORDERS
    ================================= */


    totalOrdersElement.innerHTML =
        orders.length;



    /* =================================
       PENDING ORDERS
    ================================= */


    const pendingOrders =

        orders.filter(order =>

            String(
                order.status || ""
            ).toLowerCase() ===
            "pending"

        ).length;


    pendingOrdersElement.innerHTML =
        pendingOrders;



    /* =================================
       UNIQUE CUSTOMERS
    ================================= */


    const customers =
        new Set();


    orders.forEach(order => {

        if (order.phone) {

            customers.add(
                order.phone
            );

        }

    });


    customersElement.innerHTML =
        customers.size;



    /* =================================
       RECENT ORDERS
    ================================= */


    recentOrdersElement.innerHTML =
        "";



    const recent =
        orders.slice(0, 5);



    if (recent.length === 0) {

        recentOrdersElement.innerHTML = `

        <tr>

            <td colspan="4">
                No orders found.
            </td>

        </tr>

        `;

        return;

    }



    recent.forEach(order => {


        /* Get readable item */

        const itemText =
            getItemText(order.Items);



        recentOrdersElement.innerHTML += `

        <tr>

            <td>
                #${order.id || "—"}
            </td>


            <td>
                ${order.customer_name || "Customer"}
            </td>


            <td>
                ${itemText}
            </td>


            <td>
                ${order.status || "Pending"}
            </td>

        </tr>

        `;

    });

}



/* =====================================
   LOAD INVENTORY
===================================== */


async function loadInventory() {


    const { data, error } =

        await supabaseClient

        .from("inventory")

        .select("*")

        .order("item_name", {
            ascending: true
        });



    console.log(
        "DASHBOARD INVENTORY:",
        data
    );


    console.log(
        "INVENTORY ERROR:",
        error
    );



    if (error) {

        console.error(
            "Error loading inventory:",
            error
        );

        return;

    }



    const inventory =
        data || [];



    /* =================================
       LOW STOCK
    ================================= */


    const lowStock =

        inventory.filter(item =>

            Number(item.quantity) <=
            Number(item.low_stock)

        );



    lowStockElement.innerHTML =
        "";



    if (lowStock.length === 0) {

        lowStockElement.innerHTML = `

        <tr>

            <td colspan="3">
                All inventory levels are healthy.
            </td>

        </tr>

        `;

        return;

    }



    lowStock.forEach(item => {


        lowStockElement.innerHTML += `

        <tr>

            <td>
                ${item.item_name}
            </td>


            <td>
                ${item.quantity}
                ${item.unit || ""}
            </td>


            <td>
                Low
            </td>

        </tr>

        `;

    });

}



/* =====================================
   INITIAL LOAD
===================================== */


loadOrders();

loadInventory();



/* =====================================
   REALTIME ORDERS
===================================== */


supabaseClient

.channel("dashboard-orders")

.on(

    "postgres_changes",

    {

        event: "*",

        schema: "public",

        table: "Orders"

    },

    (payload) => {

        console.log(
            "ORDER UPDATE:",
            payload
        );

        loadOrders();

    }

)

.subscribe();



/* =====================================
   REALTIME INVENTORY
===================================== */


supabaseClient

.channel("dashboard-inventory")

.on(

    "postgres_changes",

    {

        event: "*",

        schema: "public",

        table: "inventory"

    },

    (payload) => {

        console.log(
            "INVENTORY UPDATE:",
            payload
        );

        loadInventory();

    }

)

.subscribe();


</script>
